title: Credit Union Mergers
item: deal
trial: true

scope: |
  In: U.S. credit union + credit union mergers, and credit union purchases of whole banks
  (purchase of substantially all of a bank's assets and liabilities), from the first public
  announcement (or the first regulator filing when there is no announcement) through completion.
  Every deal still pending is in. Completed or called-off deals stay in the feed once added.
  The first load (Nov 21, 2026) took every pending deal plus deals completed since Aug 23, 2026.
  Out: league or trade-association mergers, non-U.S. credit unions (Canada, Ireland, Australia...),
  CUSO or vendor deals, branch-only or loan-portfolio purchases, banks buying credit unions,
  charter conversions with no merger.

instructions: |
  Sources to check every run, besides the waiting list and searches:
  - NCUA's list of proposed mergers with member vote dates:
    https://ncua.gov/support-services/credit-union-merger-acquisition/comments-proposed-credit-union-mergers
    Add every row that isn't tracked yet (it names the merging and continuing credit unions and the
    vote date). It is a regulator source.
  Coverage: besides the collected sources, check CU Today (cutoday.info), Credit Union Times
  (cutimes.com), CUInsight (cuinsight.com), Credit Union Daily (thecudaily.com), Tyfone
  (tyfone.com), Banking Dive, American Banker, PR Newswire, GlobeNewswire, Business Wire, the
  credit unions' own newsrooms and merger pages, NCUA (proposed-merger list, regulations.gov
  dockets, press releases) and state regulators' bulletins (CT DOB, NY DFS weekly bulletin, etc.).
  On the first Monday of each month, run the review searches over the last 90 days and compare with
  tracked deals, to catch anything missed. When you add a deal that was announced more than 7 days
  ago, start notes with "Added <today> (missed at announcement)."
  Credit unions' merger pages: find them through WebSearch (e.g. "<credit union> merger") so the
  page comes back as a search result, then open it with WebFetch. If WebFetch still can't open a
  credit union's own public page, read it from the shell with curl and a plain browser User-Agent
  (the same way as logos) and pdftotext/HTML stripping. Never do this for a page that blocks you
  or asks you to log in; skip it and say so in your message.
  Sizes, locations, cities, CEOs and footprint: run
    python3 feeds/mergers/tools/sizes.py cu:<charter> cu:<charter> bank:<FDIC cert>
  (needs pdftotext: apt-get install -y poppler-utils). It reads NCUA's current profile (the newest
  call report quarter, with today's branch list) and FDIC BankFind. Use it for every new deal and,
  for open deals, whenever its quarter is newer than size_as_of. creditunions.online (which repackages
  NCUA data) is a fallback only, labeled aggregator.
  Logos (every organization in a tracked deal needs one; check logos_missing every run):
    python3 feeds/mergers/tools/find_logo.py <slug> <slug> ...   then view /tmp/logo-candidates/sheet.png.
  It handles header images, inline SVG and SVG sprites. If a site blocks you (403) or shows only an
  anniversary/co-branded/promo mark: use the logo from the organization's own press release (search
  https://www.prnewswire.com/search/news/?keyword="<name>", GlobeNewswire, Business Wire; release
  images are on mma.prnewswire.com) or from its own press-release PDF (pdfimages). For a merged
  organization whose site now shows the acquirer, use its own logo from a press release dated before
  the merger. Press-release PDFs are the most reliable fallback: WebSearch "<name> press release"
  and look for PDFs on the organization's own media host (e.g. Suncoast's are on edge.sitecorecloud.io);
  download one with curl, run pdfimages -png -f 1 -l 1, and view the letterhead image. A vendor's release
  on PR Newswire usually carries the vendor's logo, not the credit union's, so check before using it.
  If the only mark is a lockup of the logo plus "25 years" or similar, separated by a divider line,
  crop the organization's own mark out of it. Never use online-banking product marks (e.g. "It's Me
  247", "My247"), anniversary badges, signatures or CEO photos. Once a site has refused you (403),
  don't request it again with different headers. Tiny credit unions with no website may have no
  public logo; list them in your message.
  Sizes: never take assets, members or locations from news stories.
  - (sizes.py does all of the following.) Credit unions: assets and members from NCUA's details record,
    https://mapping.ncua.gov/api/CreditUnionDetails/GetCreditUnionDetails/<charter>
    (creditUnionAssets in dollars, creditUnionNom = members; callReportCycleDates shows the latest
    cycle). Locations = member-service Branch/Corporate Office sites in NCUA's current profile;
    fallback: the latest quarterly data zip ("Credit Union Branch Information.txt", MemberServices = 1),
    https://ncua.gov/files/publications/analysis/call-report-data-YYYY-MM.zip
  - Banks: assets and offices from FDIC BankFind, https://api.fdic.gov/banks/institutions?filters=CERT:<cert>
    (ASSET is in $ thousands). Banks have no member count.
  - Refresh open deals' sizes when a new call report quarter is published (NCUA posts each quarter
    about two months after quarter end). Set size_as_of to the quarter used.
  - Once a deal is Completed, freeze its sizes at the last call report filed before the merger,
    for both sides; never replace them with the combined credit union's later figures.
  - combined_assets = continuing assets + partner assets, same quarter.
  NCUA's details record also shows creditUnionStatus: when the merging credit union turns
  "Inactive", the merger has completed (the record can lag by several weeks).
  Every deal also needs, for both sides: headquarters city, current CEO (NCUA's record has
  creditUnionCeo and creditUnionCity; write names as "First Last"), and for the deal: combined
  members and locations (sums, same quarter), footprint states (from the branch data), the combined
  figures as the announcement stated them, and what the deal still needs to close.
  Read both credit unions' own merger pages (usually <site>/merger), not only news: they give the
  most precise timing (Legal Day 1), which members vote, and remaining approvals.
  NCUA and FDIC records lag completions by weeks. If a merging organization's own website already
  shows the acquirer's brand, note it, then confirm completion from a release or news before
  setting Completed. When an open deal has no announcement date, search for the first public report
  each time you re-check it.
  Re-check every open deal for regulatory approval, member votes (and results), closing dates,
  the continuing name, the continuing CEO and what is still needed; clear next_steps when it completes.
  Merger of equals: Continuing CU is the credit union whose charter legally survives; put the
  brand the combined credit union will use in new_name (example: SELCO's charter continues under
  the Numerica name).
  A credit union buying two banks is two rows.
  Status ladder: Announced (intent or agreement signed) > Approved (regulators approved; member vote
  or closing still to come) > Members approved (the merging credit union's members voted yes) >
  Completed (legal effective date), or Called off. For bank purchases, skip Members approved.
  If a member vote fails, set Called off and say so in notes.
  Completing a deal: in the same update that sets Completed, also set completed, ceo, expected_close
  "Completed", clear next_steps and freeze sizes. completed is the legal effective date ("Legal Day 1")
  from the credit union's merger page, a release or news. When no source gives the day, use what the
  sources do prove: a month a source states ("Oct 2026"), otherwise the quarter from NCUA filings
  (merging CU's last call report Jun 30 and Inactive by the Sep 30 cycle = "Q3 2026"; filed a Sep 30
  report and now Inactive = "Q4 2026"). Then keep looking for the exact day.
  Completed deals are not on the worklist, so every run also takes up to 5 Completed deals whose
  completed is not a full date or whose ceo is blank, and searches for the missing facts
  ("<partner> merger effective", the continuing credit union's merger or news page, NCUA press
  releases, state bulletins).
  CEO names: the name the person uses publicly, first and last, no middle initials. NCUA lists legal
  names (Truliant's Todd Hall is "HALL, WILLIAM"; HOPE's Bill Bynum is "BYNUM, WILLIAM"), so for
  credit unions over $1B confirm the name on the credit union's own site or a recent release.

date_field: announced
key: [acquirer, partner]

fields:
  - name: announced
    type: date
    label: Announced
    scored: true
    help: Date of the first public announcement (press release, intent to merge or signed agreement), or the first regulator filing when there was no announcement. Leave blank if no source gives a date; the review fills it in.
  - name: acquirer
    type: org
    label: Continuing CU
    required: true
    help: The continuing (legally surviving) credit union, full legal name.
  - name: partner
    type: org
    label: Merging partner
    required: true
    help: The credit union or bank merging into the continuing credit union, full legal name.
  - name: deal_type
    type: choice
    label: Deal type
    choices: [CU merger, Merger of equals, Bank purchase]
    required: true
    help: Merger of equals only when the credit unions themselves call it that.
  - name: status
    type: choice
    label: Status
    choices: [Announced, Approved, Members approved, Completed, Called off]
    required: true
    help: See the status ladder in instructions.
  - name: expected_close
    type: text
    label: Expected close
    pattern: '(Q[1-4] \d{4}|H[12] \d{4}|\d{4}|Not Disclosed|Completed|Called off)'
    pattern_hint: "must be a quarter (Q2 2027), half (H1 2027), year, Not Disclosed, Completed or Called off"
    scored: true
    help: Legal close as a quarter or half ("end of 2026" = Q4 2026, "early 2028" = H1 2028); "Not Disclosed" when no source gives timing; "Completed" once done; "Called off" if abandoned.
  - name: member_vote
    type: datetext
    label: Member vote
    help: Date of the merging credit union's member vote (NCUA's proposed-merger list gives it). Blank for banks.
  - name: completed
    type: datetext
    label: Completed
    help: Legal effective date ("Legal Day 1"); required once status is Completed. If no source gives the day, the month a source states (Oct 2026), else the quarter NCUA filings prove (Q3 2026). See "Completing a deal".
  - name: new_name
    type: text
    label: Name after merger
    help: Only if the combined credit union will use a different name from the continuing credit union.
  - name: ceo
    type: text
    label: Continuing CEO
    help: Who leads the combined credit union. For a CU merger or bank purchase, the continuing credit union's CEO (the acquirer_ceo person) unless a source names someone else, such as a named successor or the partner's CEO. For a merger of equals, only when a source names them. Never blank when acquirer_ceo is known, except a merger of equals.
  - name: acquirer_ceo
    type: text
    label: Continuing CU CEO
    help: The continuing credit union's current president/CEO, first and last name as they use it publicly, no middle initials (NCUA's record gives a legal name; the credit union's own site or news wins).
  - name: partner_ceo
    type: text
    label: Partner CEO
    help: The merging credit union's or bank's current president/CEO, first and last name as they use it publicly, no middle initials. For completed deals, the last CEO before the merger.
  - name: acquirer_city
    type: text
    label: Continuing CU city
    help: Headquarters city, in normal capitalization (Spokane Valley).
  - name: partner_city
    type: text
    label: Partner city
    help: Headquarters city of the merging credit union or bank.
  - name: acquirer_assets
    type: money
    label: Continuing CU assets
    scored: true
  - name: acquirer_members
    type: int
    label: Continuing CU members
    scored: true
  - name: acquirer_locations
    type: int
    label: Continuing CU locations
    scored: true
    help: Member-service locations in the latest NCUA branch file (FDIC offices for banks).
  - name: partner_assets
    type: money
    label: Partner assets
    scored: true
  - name: partner_members
    type: int
    label: Partner members
    scored: false
    help: Credit unions only; blank for banks.
  - name: partner_locations
    type: int
    label: Partner locations
    scored: true
  - name: combined_assets
    type: money
    label: Combined assets
    scored: true
    help: Continuing assets + partner assets, same quarter.
  - name: combined_members
    type: int
    label: Combined members
    help: Continuing members + partner members, same quarter. Credit union deals only; blank for bank purchases.
  - name: combined_locations
    type: int
    label: Combined locations
    help: Continuing locations + partner locations, before any closures.
  - name: footprint
    type: text
    label: Footprint
    pattern: '[A-Z]{2}(, [A-Z]{2})*'
    pattern_hint: "must be two-letter states separated by commas, e.g. WA, OR, ID"
    help: States where the combined credit union has member-service locations, most locations first (from the NCUA branch file; FDIC branch locations for banks).
  - name: announced_figures
    type: text
    label: Figures as announced
    help: The combined size the credit unions stated in their announcement, in their words, e.g. "Nearly $8B in assets, 325,000+ members, 38 branches". Never computed.
  - name: next_steps
    type: text
    label: Still needed
    help: What the deal still needs before it closes, as a source states it, e.g. "Regulatory approval and a Numerica member vote". Blank once completed.
  - name: size_as_of
    type: text
    label: Sizes as of
    help: The call report quarter the assets and members come from, e.g. "Q3 2026", or "CU Q3 2026; bank Q2 2026". Locations come from the latest NCUA branch file.
  - name: state
    type: state
    label: State
    help: Continuing credit union's headquarters state.
  - name: partner_state
    type: state
    label: Partner state
  - name: notes
    type: text
    label: Notes

derived:
  - name: headline
    label: Headline
    cases:
      - when: {status: Completed, deal_type: Bank purchase}
        template: "{acquirer_short} completes purchase of {partner_short}"
      - when: {status: Completed}
        template: "{acquirer_short} completes merger with {partner_short}"
      - when: {status: Called off}
        template: "{acquirer_short} and {partner_short} call off their merger"
      - when: {deal_type: Merger of equals}
        template: "{partner_short} and {acquirer_short} announce a merger of equals"
      - when: {deal_type: Bank purchase}
        template: "{acquirer_short} to buy {partner_short}"
      - when: {status: Members approved}
        template: "{partner_short} members approve merger with {acquirer_short}"
      - template: "{acquirer_short} and {partner_short} to merge"
  - name: acquirer_hq
    label: Continuing CU HQ
    cases:
      - when: {acquirer_city: ""}
        template: "{state}"
      - template: "{acquirer_city}, {state}"
  - name: partner_hq
    label: Partner HQ
    cases:
      - when: {partner_city: ""}
        template: "{partner_state}"
      - template: "{partner_city}, {partner_state}"
  - name: region
    label: Region
    map_from: state
    groups:
      New England: [CT, ME, MA, NH, RI, VT]
      Rest of the Northeast: [NJ, NY, PA]
    default: Elsewhere

open_when: {field: status, not_in: [Completed, Called off]}

sources:
  # CUInsight's own RSS feeds refuse GitHub's servers (403), so CUInsight comes in through Google News.
  - {name: Google News - CUInsight deals, type: google_news, query: 'site:cuinsight.com (acquire OR acquisition OR "members approve" OR "completes merger" OR "intent to merge") when:7d'}
  - {name: Banking Dive, type: rss, url: https://www.bankingdive.com/feeds/news/}
  - {name: CreditUnions.com, type: rss, url: https://creditunions.com/feed/}
  - {name: PR Newswire banking, type: rss, url: https://www.prnewswire.com/rss/financial-services-latest-news/banking-financial-services-list.rss}
  - {name: Google News - credit union merger, type: google_news, query: '"credit union" merger when:7d'}
  - {name: Google News - intent to merge, type: google_news, query: '"credit union" "intent to merge" when:7d'}
  - {name: Google News - CU buys bank, type: google_news, query: '"credit union" acquire bank when:7d'}
  - {name: Google News - CU Today, type: google_news, query: 'site:cutoday.info merger when:7d'}
  - {name: Google News - CU Today (merge/acquire), type: google_news, query: 'site:cutoday.info merge OR acquire when:7d'}
  - {name: Google News - CU Times, type: google_news, query: 'site:cutimes.com merger when:7d'}
  - {name: Google News - CUInsight, type: google_news, query: 'site:cuinsight.com merge when:7d'}
  - {name: Google News - Credit Union Daily, type: google_news, query: 'site:thecudaily.com merger when:7d'}
  - {name: Google News - Tyfone, type: google_news, query: 'site:tyfone.com merger when:7d'}
  - {name: Google News - American Banker, type: google_news, query: 'site:americanbanker.com credit union merger when:7d'}
  - {name: Google News - PR Newswire, type: google_news, query: 'site:prnewswire.com "credit union" merge when:7d'}
  - {name: Google News - GlobeNewswire, type: google_news, query: 'site:globenewswire.com "credit union" merger when:7d'}
  - {name: Google News - Business Wire, type: google_news, query: 'site:businesswire.com "credit union" merger when:7d'}
  - {name: Google News - CreditUnions.com, type: google_news, query: 'site:creditunions.com merger when:7d'}

collect:
  include_any: [merger, merge, acquire, acquisition, combine, consolidat]
  exclude_any: []

review:
  time: "03:33"
  lookback_days: 3
  monday_lookback_days: 30
  recheck_max: 25
  searches:
    - credit union merger
    - credit unions intent to merge
    - credit union members approve merger
    - credit union merger completed
    - credit union to acquire bank
    - credit union completes bank acquisition
    - credit unions announce intent to combine
    - credit union definitive merger agreement
    - credit union merger of equals
    - site:cutoday.info merger
    - site:cutimes.com merger
    - site:cuinsight.com merger
    - site:thecudaily.com merger
    - site:tyfone.com merger
    - site:bankingdive.com credit union bank
    - site:regulations.gov NCUA merger

message:
  new_line: "{acquirer_short} + {partner_short} ({state}) - {status} - {combined_assets} combined - close {expected_close} - accuracy {accuracy}"
  update_line: "{acquirer_short} + {partner_short}: <what changed>"
  notes: List New England deals first, then the rest of the Northeast, then everything else, newest first within each group.

accuracy: {enabled: true}
